<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <title>Login</title>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <nav class="bg-blue-600 p-4 text-white flex items-center justify-between mb-8 ">
        <div>
            <h1 class="text-3xl italic font-bold">
                AI Blog Generator
            </h1>
        </div>
        <div>
            <a href="login.html" class="text-white hover:underline">Login</a>
            <a href="login.html" class="text-white hover:underline">Signup</a>
        </div>
    </nav>
    <!-- main content -->
     <div class="flex item-center justify-center h-screen mt-4">
        <div class="bg-white p-8 shadow-md rounded-lg max-w-md w-full">
            <!-- Login form -->
             <form class="space-y-4">
                <h2 class="text-xl font-semibold">SignUp</h2>
                <div>
                    <label for="username"class="block mb-1 font-medium">Username</label>
                    <input type="text" id="username" name="Username" placeholder="Enter your username... " class="w-full p-2 border rounded focus:outline-none focus:border-gray-400 focus:ring-2 focus:ring-blue-200">
                </div>
                <div>
                    <label for="email"class="block mb-1 font-medium">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email... " class="w-full p-2 border rounded focus:outline-none focus:border-gray-400 focus:ring-2 focus:ring-blue-200">
                </div>
                <div>
                    <label for="password"class="block mb-1 font-medium">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password... " class="w-full p-2 border rounded focus:outline-none focus:border-gray-400 focus:ring-2 focus:ring-blue-200">
                </div>
                <div>
                    <label for="repeatpassword"class="block mb-1 font-medium">Confirm Password</label>
                    <input type="password" id="repeatpassword" name="repeatpassword" placeholder="Confirm the password that you have given..." class="w-full p-2 border rounded focus:outline-none focus:border-gray-400 focus:ring-2 focus:ring-blue-200">
                </div>
                <button type="submit"class="w-full bg-blue bg-blue-600 text-white p-2 rounded hover:bg-blue-700  hover:text-2xl">Signup</button>
             </form>
        </div>
     </div>
</body>
</html>
